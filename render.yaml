# Blueprint de Render: en el panel de Render, "New > Blueprint" y elige este repo.
# Las variables marcadas sync: false se llenan a mano la primera vez (salen de `npm run secretos`).
services:
  - type: web
    name: pasaje-backend
    runtime: docker
    plan: starter # siempre encendido: Socket.IO y la tarea de las 4 a. m. no funcionan si el servicio se duerme
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: 'true'
      - key: DATABASE_URL # Supabase de producción, Transaction pooler (puerto 6543)
        sync: false
      - key: JWT_SECRETO
        sync: false
      - key: LLAVE_FIRMA_BOLETOS
        sync: false
      - key: CORS_ORIGENES # URL del panel, p. ej. https://panel-ruta67.pages.dev
        sync: false
